<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Webpage with CSS and JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Welcome to the Interactive Webpage</h1>
        <p>Experience smooth animations and personalized features.</p>
    </header>

    <section>
        <button id="animateButton">Click Me to Animate</button>
        <div id="box" class="box"></div>
    </section>

    <section>
        <h2>User Preferences</h2>
        <label for="bgColor">Choose Background Color:</label>
        <input type="color" id="bgColor" name="bgColor" value="#ffffff">
        <button id="savePreferences">Save Preferences</button>
    </section>

    <footer>
        <p>&copy; 2025 Interactive Webpage</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
